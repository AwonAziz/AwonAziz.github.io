# ---------------------------------------------------------------------------
#  GitHub Pages deploy
# ---------------------------------------------------------------------------
#  Two things happen here, and the order matters:
#
#  1. `app/` is built and quality-gated — lint, then typecheck, then the actual
#     build. A failing type error never reaches the deploy step, so a broken
#     push cannot ship. This is the same gate that caught a production-only
#     ZodError during the first deploy.
#
#  2. The built site is copied to the repository root and committed back.
#
#  Step 2 is not the usual pattern, and it exists for a specific reason: Pages
#  here is configured to deploy `main/root` as a branch build with Jekyll, which
#  cannot be changed without repo admin access. A Jekyll branch build serves
#  whatever is at the root, so the built site has to *be* at the root. Flipping
#  the setting to "GitHub Actions" (Settings -> Pages -> Source) lets step 2 be
#  deleted and the `actions/deploy-pages` artifact path used directly.
#
#  The skip-ci marker on the commit is not optional. Without it the commit this
#  workflow makes would re-trigger the workflow that made it.
# ---------------------------------------------------------------------------
name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never two publishers racing for the root.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # An unset Actions variable arrives as an empty string, not as
          # omitted, and an empty string is not a valid URL — the content schema
          # rejects it and the deployed page dies before it mounts.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://awonaziz.github.io' }}

      # Publish only from the default branch, and only on a real push. Pull
      # requests still get the full quality gate above.
      - name: Publish to repository root
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          root="$(git rev-parse --show-toplevel)"

          # Replace the deployed artefacts wholesale so a renamed or deleted
          # file cannot survive from a previous deploy.
          rm -rf "$root/assets"
          cp -r app/dist/assets "$root/assets"
          cp app/dist/index.html "$root/index.html"

          # Each of these is optional, and this must be written as an `if`
          # rather than as `[ -e x ] && cp ...`. Under `set -e` a failing test
          # makes the whole `&&` chain return non-zero and aborts the step — so
          # the one-line idiom silently fails the job the first time any file is
          # absent, which is exactly what happened on the first run.
          for file in .nojekyll favicon.svg robots.txt sitemap.xml _headers _redirects; do
            if [ -e "app/dist/$file" ]; then
              cp "app/dist/$file" "$root/$file"
            else
              echo "skipping $file (not in build output)"
            fi
          done

          cd "$root"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets index.html favicon.svg robots.txt sitemap.xml _headers _redirects .nojekyll

          if git diff --cached --quiet; then
            echo "No change to publish."
            exit 0
          fi

          git commit -m "chore: publish build [skip ci]"
          # Only ever fast-forward: this job runs on a fresh checkout whose
          # HEAD is the commit that triggered it, so a non-fast-forward here
          # means someone pushed concurrently and the next run will reconcile.
          git push origin HEAD:main