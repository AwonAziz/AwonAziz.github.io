# ---------------------------------------------------------------------------
#  Build and deploy
# ---------------------------------------------------------------------------
#  1. `app/` is built behind a quality gate — lint, then typecheck, then the
#     actual build. A failing type error never reaches the deploy step.
#
#  2. The built site is deployed to GitHub Pages via the standard
#     `actions/deploy-pages` artifact flow.
#
#  On (2): this repo's Pages was set to "Deploy from a branch" (main/root) with
#  Jekyll, which meant the deployed site was whatever sat at the repository root
#  and publishing required committing build output back to `main`. That legacy
#  deployer stopped triggering after 2026-10-01 08:56 — an empty commit did not
#  bring it back, and the new build sat in the repo un-served. The setting is
#  repository administration and cannot be changed from a push.
#
#  Switch Settings -> Pages -> Source -> **GitHub Actions** and this workflow
#  becomes the deployer. That removes the committed root output entirely, so
#  `assets/` and the root `index.html` can be deleted from the repository and
#  `./publish.ps1` becomes unnecessary.
# ---------------------------------------------------------------------------
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Superseded runs are cancelled. A stale build check has no value, and two
# concurrent deployments race for the same Pages slot.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # An unset Actions variable arrives as an empty string rather than
          # being omitted, and an empty string is not a valid URL. The content
          # schema rejects it and the built site throws a ZodError before the
          # app mounts. That is not hypothetical - it is what the first deploy
          # did.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://awonaziz.github.io' }}

      # Only the default branch, and only on a real push. Pull requests still
      # get the full quality gate above.
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: app/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4