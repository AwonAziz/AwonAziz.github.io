# ---------------------------------------------------------------------------
#  Build check
# ---------------------------------------------------------------------------
#  This runs the full quality gate on every push and pull request:
#  lint -> typecheck -> build. A failing type error is caught here rather than
#  on the live site, which is the entire value of this workflow.
#
#  It deliberately does NOT publish.
#
#  Publishing is a manual step (`./publish.ps1` on Windows, `./publish.sh` on
#  anything else) because GitHub Pages on this repo is configured as
#  "Deploy from a branch" (main/root) with Jekyll, which cannot be changed
#  without repo admin access. An automated job that commits back to `main` needs
#  write scope to a branch that Pages may well have protected, and when that
#  push is rejected the only symptom is a red check that says nothing useful.
#
#  Two commits confirmed this: the job built and gated successfully, then failed
#  on `git push origin HEAD:main`, with the log endpoint returning 403 so the
#  reason could not be read.
#
#  If you switch Settings -> Pages -> Source to "GitHub Actions", this can be
#  replaced with the actions/deploy-pages artifact flow, which needs no write
#  permission to `main` at all. That is the better setup and it is one click.
# ---------------------------------------------------------------------------
name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref. Unlike a deploy, a stale build check
# has no value once a newer commit exists.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # An unset Actions variable arrives as an empty string rather than
          # being omitted, and an empty string is not a valid URL. The content
          # schema rejects it and the built site throws a ZodError before the
          # app mounts. That is not hypothetical - it is what the first deploy
          # did.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://awonaziz.github.io' }}