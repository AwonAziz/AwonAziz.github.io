# ---------------------------------------------------------------------------
#  GitHub Pages deploy
# ---------------------------------------------------------------------------
#  Pushes to the default branch build and publish. Also runs on any other
#  branch, but only *builds* it — so a pull request from a fork fails the
#  typecheck/lint step without ever touching Pages.
#
#  One-time setup (the workflow does this for you, but it has to happen once):
#    Settings → Pages → Build and deployment → Source → GitHub Actions
#
#  Sub-path vs. custom domain
#  -------------------------
#  A `user.github.io` *user* site serves at the root, so `VITE_BASE_PATH` is
#  empty and asset URLs stay relative. A `user.github.io/repo` *project* site
#  serves from a sub-path — also fine, because `base` defaults to "./" and Vite
#  emits relative asset URLs either way. You do not need to change anything.
# ---------------------------------------------------------------------------
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the default branch may publish. Every other trigger is a build check.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy mid-publish; let in-flight runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Lint and typecheck run here, before the build, so a broken push never
      # reaches Pages. This doubles as the quality gate on pull requests.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Canonical origin for the canonical link and the OG/JSON-LD payload.
          #
          # The `||` fallback is load-bearing. An unset Actions repository
          # variable is passed through as an empty string rather than being
          # omitted, and an empty string is not a valid URL — the content schema
          # rejects it and the deployed page dies on a ZodError.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://awonaziz.github.io' }}

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
