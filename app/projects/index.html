<!doctype html>
<html lang="en" class="bg-canvas text-ink antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Three families, three jobs, and none of them is the Space Mono costume:
        Space Grotesk  display + UI. A proportional cut of Space Mono, tuned for
                       non-display sizes, so it keeps the technical letterforms
                       without reading as a screenshot of a terminal.
        Newsreader     prose. A long-form serif reads as a hiring document, which
                       is what this page actually is.
        Geist Mono     values only: counts, timestamps, versions, paths. Never a
                       sentence — that rule is what keeps the engineering register
                       from becoming a costume.

      display=swap on all three. The canvas paints immediately and the type
      resolves in place; blocking the first paint on three families would cost
      LCP for text that has a perfectly good fallback.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Geist+Mono:wght@400;500&display=swap"
    />
    <title>Systems — Awon Aziz</title>
    <meta
      name="description"
      content="Entry-level AI and MLOps engineer. Embedding and output-quality drift, an LLM-as-judge regression suite, champion/challenger promotion, and scheduled automation that has run unattended for weeks."
    />
    <!-- A coherent default for non-JS crawlers; src/hooks/use-seo.ts rewrites
         it from the same validated config the page renders. -->
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Awon Aziz — AI / MLOps engineer" />

      name="twitter:description"
      content="Drift detection, model promotion, retrieval evaluation, incident triage."
    />
  </head>
  <body>

    <!--
      There is no preloader on this site, deliberately.

      A gate that delays the first readable sentence was on the previous version
      and it was the single worst decision in it. Full-screen entrance
      animations are named as a disqualifier in portfolio screening for an
      obvious reason: a one-second loader is a one-second delay, and the hero
      headline is the only positioning asset an engineer without an employment
      history has. The WebGL scene lazy-loads behind a gradient instead, so the
      atmosphere arrives after the content rather than in front of it.
    -->
